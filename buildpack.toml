api = "0.7"

[buildpack]
  description = "A Cloud Native Buildpack that builds Leiningen-based applications from source"
  homepage = "https://github.com/paketo-buildpacks/leiningen"
  id = "paketo-buildpacks/leiningen"
  keywords = ["java", "leiningen", "build-system"]
  name = "Paketo Buildpack for Leiningen"
  sbom-formats = ["application/vnd.cyclonedx+json", "application/vnd.syft+json"]
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/leiningen/blob/main/LICENSE"

[metadata]
  include-files = ["LICENSE", "NOTICE", "README.md", "buildpack.toml", "linux/amd64/bin/build", "linux/amd64/bin/detect", "linux/amd64/bin/run", "linux/arm64/bin/build", "linux/arm64/bin/detect", "linux/arm64/bin/run"]
  pre-package = "scripts/build.sh --target linux/amd64 --target linux/arm64"

  [[metadata.configurations]]
    build = true
    default = "uberjar"
    description = "the arguments to pass to Lein"
    name = "BP_LEIN_BUILD_ARGUMENTS"

  [[metadata.configurations]]
    build = true
    default = "target/*-standalone.jar"
    description = "the built application artifact explicitly.  Supersedes $BP_LEIN_BUILT_MODULE"
    name = "BP_LEIN_BUILT_ARTIFACT"

  [[metadata.configurations]]
    build = true
    description = "the module to find application artifact in"
    name = "BP_LEIN_BUILT_MODULE"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "colon separated list of glob patterns, matched source files are included"
    name = "BP_INCLUDE_FILES"

  [[metadata.configurations]]
    build = true
    default = ""
    description = "colon separated list of glob patterns, matched source files are removed"
    name = "BP_EXCLUDE_FILES"

  [[metadata.dependencies]]
    cpes = ["cpe:2.3:a:leiningen:leiningen:2.13.0:*:*:*:*:*:*:*"]
    id = "lein"
    name = "Leiningen"
    purl = "pkg:generic/leiningen@2.13.0"
    sha256 = "61cf3a0786748238bc7d78e24b77a875d8c4c0704c3bc11f7180e979b46bcc2c"
    source = "https://github.com/technomancy/leiningen/archive/refs/tags/2.13.0.tar.gz"
    source-sha256 = "a71aaf44eaf7796198943bd6db7662c99664bb6441f8dc7216d4a87fa4ea4dad"
    stacks = ["io.buildpacks.stacks.bionic", "io.paketo.stacks.tiny", "*"]
    uri = "https://raw.githubusercontent.com/technomancy/leiningen/2.13.0/bin/lein"
    version = "2.13.0"

    [[metadata.dependencies.licenses]]
      type = "EPL-1.0"
      uri = "https://github.com/technomancy/leiningen/blob/stable/COPYING"

  [[metadata.dependencies]]
    checksum = "sha256:61cf3a0786748238bc7d78e24b77a875d8c4c0704c3bc11f7180e979b46bcc2c"
    cpe = "cpe:2.3:a:leiningen:leiningen:2.13.1:*:*:*:*:*:*:*"
    id = "lein"
    name = "Leiningen"
    purl = "pkg:generic/leiningen@2.13.1?checksum=61cf3a0786748238bc7d78e24b77a875d8c4c0704c3bc11f7180e979b46bcc2c&download_url=https://github.com/technomancy/leiningen/archive/refs/tags/2.13.1.tar.gz"
    sha256 = "61cf3a0786748238bc7d78e24b77a875d8c4c0704c3bc11f7180e979b46bcc2c"
    source = "https://github.com/technomancy/leiningen/archive/refs/tags/2.13.1.tar.gz"
    source-checksum = "sha256:28bd0f099ad7e155c6f2880b118fbab591fa43baf0baff862bd402249825d88b"
    stacks = ["io.buildpacks.stacks.bionic", "io.paketo.stacks.tiny", "*"]
    uri = "https://raw.githubusercontent.com/technomancy/leiningen/2.13.1/bin/lein"
    version = "2.13.1"

    [[metadata.dependencies.licenses]]
      type = "EPL-1.0"
      uri = "https://github.com/technomancy/leiningen/blob/stable/COPYING"

  [[metadata.dependency-constraints]]
    constraint = "*"
    id = "lein"
    patches = 2

[[stacks]]
  id = "io.buildpacks.stacks.bionic"

[[stacks]]
  id = "io.paketo.stacks.tiny"

[[stacks]]
  id = "*"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
